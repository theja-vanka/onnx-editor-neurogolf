[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-editor-server"
version = "0.1.0"
description = "FastAPI backend for the ARC + ONNX graph editor (NeuroGolf 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "python-multipart==0.0.9",
    "numpy==2.4.4",
    "onnx==1.21.0",
    "onnxruntime==1.24.4",
    "onnx-tool==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "httpx==0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
